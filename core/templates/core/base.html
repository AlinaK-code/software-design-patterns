{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Умный дом{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{% url 'dashboard' %}" class="logo">Smart Home</a>
      <nav class="nav">
        <a href="{% url 'dashboard' %}">Главная</a>
        <a href="{% url 'devices' %}">Устройства</a>
        <a href="{% url 'scenarios' %}">Сценарии</a>
        <a href="{% url 'events' %}">События</a>
        <a href="{% url 'patterns_demo' %}">Паттерны</a>
        <a href="/admin/">Админка</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="message {{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
